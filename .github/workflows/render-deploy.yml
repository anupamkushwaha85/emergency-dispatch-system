name: CI/CD Pipeline to Render

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
          
      - name: Build and Test Application
        run: ./mvnw clean package
        
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only deploy on pushes to the main/master branches, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering deployment on Render..."
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL is not set in GitHub Secrets."
            echo "Please add your Render Deploy Hook URL to your repository secrets."
            exit 1
          fi
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully!"
